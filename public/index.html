<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MB PRO MAX</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:Poppins;
  margin:0;
  background:linear-gradient(135deg,#1a002f,#6a00ff);
  color:white;
}

.container{
  padding:20px;
}

h1{
  text-align:center;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.08);
  border-radius:20px;
  padding:15px;
  margin:10px 0;
  backdrop-filter:blur(15px);
  box-shadow:0 0 20px rgba(0,0,0,0.3);
}

/* API */
.api-card{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

button{
  background:#a855f7;
  border:none;
  color:white;
  padding:6px 12px;
  border-radius:10px;
  cursor:pointer;
}

/* INPUT */
input{
  padding:10px;
  border-radius:10px;
  border:none;
  width:150px;
}

/* QR */
#qr{
  margin-top:10px;
  text-align:center;
}

img{
  max-width:200px;
  border-radius:10px;
}

/* TOAST */
#toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#9333ea;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}
</style>
</head>

<body>
<div class="container">

<h1>💜 MB PRO MAX</h1>

<div class="card" id="stats"></div>

<div class="card">
<h3>🚀 API</h3>

<div class="api-card">
<span>/api/create?amount=10000</span>
<button onclick="copy(this)">Copy</button>
</div>

<div class="api-card">
<span>/api/check?note=napxxxx</span>
<button onclick="copy(this)">Copy</button>
</div>

</div>

<div class="card">
<h3>💳 Tạo QR</h3>

<input id="amount" placeholder="Nhập tiền">
<button onclick="createQR()">Tạo</button>

<div id="qr"></div>
</div>

<div class="card">
<h3>📦 Đơn</h3>
<div id="orders"></div>
</div>

</div>

<div id="toast">Copied!</div>

<script src="app.js"></script>
</body>
</html>
