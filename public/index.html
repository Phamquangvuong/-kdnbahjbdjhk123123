<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dashboard-Api</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter;
  background:radial-gradient(circle at 20% 20%,#2e026d,#0a001a 60%);
  color:white;
  overflow-x:hidden;
}

/* NOISE */
body::after{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url('https://grainy-gradients.vercel.app/noise.svg');
  opacity:0.05;
  pointer-events:none;
}

/* CONTAINER */
.container{
  max-width:1200px;
  margin:auto;
  padding:40px 20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:32px;
  font-weight:700;
  background:linear-gradient(90deg,#c084fc,#a855f7);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:20px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(20px);
  border:1px solid rgba(168,85,247,0.2);
  box-shadow:0 0 30px rgba(168,85,247,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 0 50px rgba(168,85,247,0.5);
}

/* STATS */
.stat{
  font-size:22px;
  margin:10px 0;
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:none;
  margin-top:10px;
}

/* BUTTON */
button{
  margin-top:10px;
  width:100%;
  padding:12px;
  border:none;
  border-radius:12px;
  background:linear-gradient(135deg,#a855f7,#7e22ce);
  color:white;
  font-weight:600;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* QR */
#qr img{
  width:200px;
  margin-top:10px;
  border-radius:12px;
  box-shadow:0 0 20px #a855f7;
}

/* COUNTDOWN */
#countdown{
  font-size:14px;
  margin-top:6px;
  opacity:0.9;
}

.expire{
  color:#ff4d4d;
  font-weight:600;
}

.pulse{
  animation:pulse 1s infinite;
}

@keyframes pulse{
  0%{opacity:1}
  50%{opacity:0.4}
  100%{opacity:1}
}

/* ORDERS */
.order{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin-top:10px;
  border-radius:12px;
  background:rgba(0,0,0,0.4);
}

/* STATUS COLORS */
.paid{border-left:4px solid #22c55e}
.pending{border-left:4px solid orange}
.expired{border-left:4px solid red}

/* BADGE */
.badge{
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
}

.paid .badge{background:#22c55e}
.pending .badge{background:orange}
.expired .badge{background:red}

/* TOAST */
.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#9333ea;
  padding:10px 20px;
  border-radius:10px;
  display:none;
}

/* ANIMATION */
.fade{
  animation:fade 0.5s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title">DASHBOARD</div>
  <div id="clock"></div>
</div>

<div class="grid">

<div class="card fade">
  <h3>📊 Stats</h3>
  <div id="stats"></div>
</div>

<div class="card fade">
  <h3>💳 Create Bill</h3>
  <input id="amount" placeholder="Nhập số tiền">
  <button onclick="create()">Tạo ngay</button>

  <div id="qr"></div>
  <div id="countdown"></div>
</div>

<div class="card fade">
  <h3>⚡ API Status</h3>
  <div id="status">Checking...</div>
</div>

</div>

<div class="card fade">
  <h3>📦 Orders</h3>
  <div id="orders"></div>
</div>

</div>

<div class="toast" id="toast">Done</div>

<script src="app.js"></script>
</body>
</html>
