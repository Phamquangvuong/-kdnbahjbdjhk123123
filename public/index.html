<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MB Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter;
  background:radial-gradient(circle at top,#1a0033,#0a001a);
  color:white;
}

/* CONTAINER */
.container{
  max-width:1100px;
  margin:auto;
  padding:30px 20px;
}

/* HEADER */
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.title{
  font-size:28px;
  font-weight:700;
}

.glow{
  color:#c084fc;
  text-shadow:0 0 15px #a855f7;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.05);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(20px);
  box-shadow:0 0 25px rgba(168,85,247,0.2);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px) scale(1.01);
  box-shadow:0 0 40px rgba(168,85,247,0.5);
}

/* INPUT */
input{
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  margin-top:10px;
}

/* BUTTON */
button{
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:10px;
  background:linear-gradient(135deg,#a855f7,#7e22ce);
  color:white;
  font-weight:500;
  cursor:pointer;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

/* QR */
#qr img{
  width:200px;
  margin-top:10px;
  border-radius:10px;
  box-shadow:0 0 15px #a855f7;
}

/* ORDERS */
.order{
  background:rgba(0,0,0,0.4);
  padding:12px;
  border-radius:12px;
  margin-top:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

/* STATUS */
.paid{border-left:4px solid #22c55e}
.pending{border-left:4px solid orange}
.expired{border-left:4px solid red}

/* BADGE */
.badge{
  padding:5px 10px;
  border-radius:10px;
  font-size:12px;
}

.paid .badge{background:#22c55e}
.pending .badge{background:orange}
.expired .badge{background:red}

/* ANIMATION */
.fade{
  animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
  <div class="title glow">DASHBOARD</div>
  <div id="time"></div>
</div>

<div class="grid">

<!-- CREATE -->
<div class="card fade">
  <h3>💳 Tạo đơn</h3>
  <input id="amount" placeholder="Nhập số tiền...">
  <button onclick="create()">Tạo ngay</button>
  <div id="qr"></div>
</div>

<!-- STATS -->
<div class="card fade">
  <h3>📊 Thống kê</h3>
  <div id="stats"></div>
</div>

</div>

<!-- ORDERS -->
<div class="card fade">
  <h3>📦 Danh sách đơn</h3>
  <div id="orders"></div>
</div>

</div>

<script src="app.js"></script>
</body>
</html>
